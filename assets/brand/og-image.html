<!DOCTYPE html>
<!-- Source for og-image.png (1200×630 social preview). It renders the site's own lens
     (assets/script.js, compact mode) from /assets/apps.json, so the preview always matches
     the hero. Regenerate with: node scripts/render-og.mjs -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="/" />   <!-- app icon paths in apps.json are relative to the site root -->
  <title>Focal Studio — social preview</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    :root { --bg: #0B0B0D; --text: #F2F2F3; --muted: #9A9AA3; --accent: #5BD08A; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      min-height: 0;
      line-height: normal;
      font-family: "Geist", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(520px 420px at 76% 50%, rgba(91, 208, 138, 0.16), transparent 70%),
        radial-gradient(700px 400px at 0% 100%, rgba(142, 155, 255, 0.07), transparent 70%),
        var(--bg);
    }
    .frame { position: absolute; inset: 22px; border: 1px solid rgba(255,255,255,0.07); border-radius: 28px; }
    .copy { position: absolute; left: 84px; top: 82px; width: 560px; }
    .brand { display: flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    .brand svg { width: 40px; height: 40px; color: var(--accent); }
    .brand span span { color: var(--muted); font-weight: 400; }
    h1 { margin-top: 44px; font-size: 84px; line-height: 0.98; font-weight: 600; letter-spacing: -0.045em; }
    .serif { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-weight: 400; color: var(--accent); letter-spacing: -0.01em; font-size: 1.08em; }
    .cta { display: inline-flex; align-items: center; gap: 12px; margin-top: 40px; padding: 16px 30px;
      border-radius: 999px; background: var(--accent); color: #06150C; font-size: 26px; font-weight: 600;
      letter-spacing: -0.01em; box-shadow: 0 14px 40px -10px rgba(91, 208, 138, 0.55); }
    .meta { position: absolute; left: 84px; bottom: 74px; display: flex; gap: 14px; align-items: center;
      font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    body::before { display: none; }
    /* The site's lens, larger than its compact catalog size */
    .og-lens { position: absolute; left: 640px; top: 60px; width: 510px; }
    .og-lens .lens--compact { max-width: none; }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7.4L21.94 13.14M15.98 9.7L15.98 21.17M15.98 14.3L6.05 20.04M12 16.6L2.06 10.86M8.02 14.3L8.02 2.83M8.02 9.7L17.95 3.96"/></svg>
      <span>focal<span> studio</span></span>
    </div>
    <h1>One thing<br />at a <span class="serif">time</span>.</h1>
    <div class="cta">Explore the apps <span aria-hidden="true">→</span></div>
  </div>
  <div class="meta"><span class="dot"></span><span id="count">Independent app studio</span><span>·</span><span>focalstudio.github.io</span></div>

  <div class="og-lens"><div class="lens--compact" data-app-lens data-lens-compact></div></div>

  <script src="/assets/script.js"></script>
  <script>
    fetch('/assets/apps.json').then((r) => r.json()).then(({ apps }) => {
      const live = apps.filter((a) => a.status === 'released').length;
      document.getElementById('count').textContent = `${apps.length} apps · ${live} out now`;
      /* Ready once the lens has rendered and every image and font has loaded */
      const lensReady = new Promise((resolve) => {
        const check = () => document.querySelector('.lens.is-ready') ? resolve() : requestAnimationFrame(check);
        check();
      });
      return lensReady.then(() => Promise.all([document.fonts.ready, ...[...document.images].map((i) => i.decode().catch(() => {}))]));
    }).then(() => requestAnimationFrame(() => { window.__ogReady = true; }));
  </script>
</body>
</html>
