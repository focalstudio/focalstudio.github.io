name: Store watch

# Once a day, checks the App Store for every app in assets/apps.json. When an app appears
# under the studio's developer account, it opens (or updates) one PR flipping it to
# "released" with its store link. It never merges: that is a human's call.
#
# Writes go through the Focal Studio Cross-Repo Bot (org secrets FOCALSTUDIO_BOT_APP_ID /
# FOCALSTUDIO_BOT_PRIVATE_KEY, the same App the template's register-website.yml uses), not
# GITHUB_TOKEN:
#   - the org blocks GITHUB_TOKEN from creating PRs, and that stays off org-wide;
#   - PRs opened by an App token trigger validate.yml; GITHUB_TOKEN PRs trigger nothing.
# A dry run needs no credentials.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what the store shows, but do not open a PR"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/store-watch
    steps:
      # Secrets can't be tested in a step-level `if:`, so they come through env first.
      - name: Check for bot credentials
        id: creds
        env:
          APP_ID: ${{ secrets.FOCALSTUDIO_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.FOCALSTUDIO_BOT_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FOCALSTUDIO_BOT_APP_ID / FOCALSTUDIO_BOT_PRIVATE_KEY are not available — the watcher can report, but not open a PR."
          fi

      - name: Mint a scoped installation token
        id: app-token
        if: steps.creds.outputs.has_creds == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FOCALSTUDIO_BOT_APP_ID }}
          private-key: ${{ secrets.FOCALSTUDIO_BOT_PRIVATE_KEY }}
          owner: focalstudio
          repositories: focalstudio.github.io

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the store
        id: check
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          # shellcheck disable=SC2086
          node scripts/check-stores.mjs $DRY_RUN --summary "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the result
        if: steps.check.outputs.changed == 'true'
        run: node scripts/validate-apps.mjs

      - name: Open or update the PR
        if: steps.check.outputs.changed == 'true' && !inputs.dry_run
        env:
          HAS_CREDS: ${{ steps.creds.outputs.has_creds }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ steps.check.outputs.title }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_ID: ${{ secrets.FOCALSTUDIO_BOT_APP_ID }}
        run: |
          if [ "$HAS_CREDS" != "true" ]; then
            echo "::error::Found a store change but has no bot credentials to open the PR with."
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add assets/apps.json assets/app-icons
          git commit -m "chore(catalog): $TITLE"
          # One stable bot-owned branch, force-updated: a re-run refreshes the open PR.
          git push --force origin "$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$RUNNER_TEMP/summary.md"
            echo "Updated PR #$EXISTING"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/summary.md"
          fi
